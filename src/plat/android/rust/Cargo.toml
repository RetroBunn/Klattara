[package]
name = "klattara-android"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Klattara for Android: the engine's C interface, the pronunciation dictionary, and what older Android needs, as a static library for the JNI bridge"

[lib]
name = "klattara_engine"
crate-type = ["staticlib"]

[dependencies]
engine = { package = "klattara", path = "../../../engine" }
