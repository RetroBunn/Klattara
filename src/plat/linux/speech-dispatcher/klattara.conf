# Klattara for Speech Dispatcher: Orca and every program that speaks through
# Speech Dispatcher can use it. install.sh puts this file in Speech Dispatcher's
# modules folder and adds Klattara to speechd.conf:
#
#   AddModule "klattara" "sd_generic" "klattara.conf"
#
# Speech Dispatcher runs klattara for each thing it says, with its own rate,
# pitch and volume (-100 to 100) and voice. Klattara has nothing to load, so it
# starts speaking at once, and stopping it ends the process. Klattara's other
# settings (base rate, flutter, each voice's [:cv] settings, dictionaries,
# sampling rate) come from ~/.config/klattara/klattara.conf.

GenericExecuteSynth "printf %s \'$DATA\' | @KLATTARA@ --sd-voice $VOICE --sd-rate $RATE --sd-pitch $PITCH --sd-volume $VOLUME"

GenericCmdDependency "@KLATTARA@"

# Speech Dispatcher gives a generic module its rate, pitch and volume as -1 to 1;
# times 100 they are its own -100 to 100, which klattara scales.
GenericRateAdd 0
GenericRateMultiply 100
GenericRateForceInteger 1
GenericPitchAdd 0
GenericPitchMultiply 100
GenericPitchForceInteger 1
GenericVolumeAdd 0
GenericVolumeMultiply 100
GenericVolumeForceInteger 1

# Klattara reads punctuation itself, so only square brackets are taken out
# (Klattara would read them as parentheses anyway). Speech Dispatcher refuses
# an empty value here.
GenericStripPunctChars "[]"

GenericLanguage "en" "en" "utf-8"
GenericLanguage "en-US" "en" "utf-8"

# The five voices, by name, and Speech Dispatcher's voice types.
AddVoice "en" "MALE1" "steve"
AddVoice "en" "FEMALE1" "brittany"
AddVoice "en" "MALE2" "gary"
AddVoice "en" "MALE3" "david"
AddVoice "en" "FEMALE2" "taylor"
AddVoice "en" "FEMALE3" "brittany"
AddVoice "en" "CHILD_MALE" "david"
AddVoice "en" "CHILD_FEMALE" "taylor"

DefaultVoice "steve"
