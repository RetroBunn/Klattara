[package]
name = "klattara-linux"
version = "1.9.7"
edition = "2024"
license = "MIT"
description = "Klattara for Linux: the klattara command, which speaks, saves WAV files, and serves Speech Dispatcher"

[[bin]]
name = "klattara"
path = "src/main.rs"

[dependencies]
engine = { package = "klattara", path = "../../engine" }
