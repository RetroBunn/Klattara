name: Klattara
options:
  bundleIdPrefix: com.dgomeze42
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9.4"
    CURRENT_PROJECT_VERSION: "1"
    # The voice extension and the app share their settings through this App
    # Group, which must start with the signing team's identifier.
    KLATTARA_BUNDLE_ID: com.dgomeze42.klattara
    KLATTARA_APP_GROUP: J4PD64C33Q.com.dgomeze42.klattara
    DEVELOPMENT_TEAM: J4PD64C33Q
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/CKlattara
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/lib
    OTHER_LDFLAGS: -lklattara
    DEAD_CODE_STRIPPING: "YES"
  configs:
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: "NO"

targets:
  Klattara:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: KlattaraVoices
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KLATTARA_BUNDLE_ID)
        PRODUCT_NAME: Klattara
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/Klattara.entitlements
        COMBINE_HIDPI_IMAGES: "YES"

  KlattaraVoices:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Extension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KLATTARA_BUNDLE_ID).voices
        PRODUCT_NAME: KlattaraVoices
        INFOPLIST_FILE: Sources/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Extension/KlattaraVoices.entitlements
        SKIP_INSTALL: "YES"
